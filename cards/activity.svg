<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Monthly GitHub contributions and streak">
<title>Monthly GitHub contributions and streak</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#FDBA74"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7F4EE" stop-opacity="0"/><stop offset=".5" stop-color="#F7F4EE" stop-opacity=".8"/><stop offset="1" stop-color="#F7F4EE" stop-opacity="0"/></linearGradient>
  <style>
    
    
    text { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .muted { fill: #A7A9AD; }
    .small { font-size: 12px; letter-spacing: 1.8px; }
    .fade { opacity: 0; animation: fadeIn .8s ease forwards; }
    .rise { opacity: 0; transform-box: fill-box; transform-origin: center; animation: rise .85s cubic-bezier(.2,.8,.2,1) forwards; }
    .shine { animation: shine 5s ease-in-out 2s infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes shine { 0%,65% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
    @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
</defs>
<rect width="1200" height="300" rx="20" fill="#171A1F"/>
<text x="42" y="44" fill="#F7F4EE" font-size="22" font-weight="700" class="rise">Contribution activity</text>
<text x="42" y="68" fill="#A7A9AD" font-size="11" letter-spacing="1.5">LAST 12 MONTHS · REFRESHED DAILY</text>
<g><text x="62" y="160" fill="#A7A9AD" font-size="14">Contribution data will appear after the first successful workflow run.</text></g>
<path d="M42 205 H1118" stroke="#424750"/>
<g class="fade" style="animation-delay:.8s">
 <text x="950" y="102" fill="#F97316" font-size="28" font-weight="700">0</text><text x="950" y="122" fill="#A7A9AD" font-size="10">CONTRIBUTIONS</text>
 <text x="950" y="160" fill="#F7F4EE" font-size="23" font-weight="700">0</text><text x="950" y="179" fill="#A7A9AD" font-size="10">ACTIVE DAYS</text>
 <text x="950" y="216" fill="#F7F4EE" font-size="23" font-weight="700">0 days</text><text x="950" y="235" fill="#A7A9AD" font-size="10">CURRENT STREAK</text>
 <text x="950" y="270" fill="#F97316" font-size="11">BUSIEST: NO CONTRIBUTION DATA YET</text>
</g>

</svg>
