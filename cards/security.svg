<svg xmlns="http://www.w3.org/2000/svg" width="350" height="150" viewBox="0 0 350 150" role="img">
    <style>
      @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
      @keyframes grow { from { transform:scaleY(.05); opacity:.25; } to { transform:scaleY(1); opacity:1; } }
      @keyframes sweep { 0%,65% { transform:translateX(-160%); } 100% { transform:translateX(260%); } }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .enter { animation:rise .8s cubic-bezier(.2,.8,.2,1) both; animation-delay:0.35s; }
      .bar { transform-box:fill-box; transform-origin:bottom; animation:grow .75s ease-out both; }
      .shine { animation:sweep 5s ease-in-out infinite; }
      .pulse { animation:pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        *,*::before,*::after { animation:none !important; transition:none !important; }
      }
    </style>
    <rect x="1" y="1" width="348" height="148" rx="15" fill="#FFFEFA" stroke="#E6DED2"/>
    <rect x="1" y="1" width="7" height="148" rx="3" fill="#F97316"/>
    <g class="enter">
      <text x="27" y="34" fill="#77736C" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">WORLD 01</text>
      <text x="27" y="76" fill="#202124" font-family="Georgia,serif" font-size="29">Cybersecurity</text>
      <text x="27" y="103" fill="#77736C" font-family="Arial,sans-serif" font-size="13">Understand. Detect. Defend.</text>
      <text x="305" y="40" fill="#F97316" font-family="Arial,sans-serif" font-size="16" font-weight="700">01</text>
      <path d="M300 119h20m-8-8 8 8-8 8" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    </svg>
